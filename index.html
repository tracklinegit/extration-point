let snd=0;

/* player */
const WP=[{n:'Pistol',rate:4,dmg:24,spd:1100,sp:.02,mag:12,rl:1.1,nz:650,am:'l',col:'#ffe9a8'},{n:'SMG',rate:13,dmg:11,spd:1000,sp:.075,mag:32,rl:1.5,nz:800,am:'l',col:'#ffd27a'},{n:'Rifle',rate:8.5,dmg:21,spd:1300,sp:.03,mag:30,rl:2,nz:1100,am:'h',col:'#ffb86b'}];
function mkPl(){const k=sv.kit>0?sv.kit:0;return{x:WORLD/2+rnd(-700,700),y:WORLD-130,vx:0,vy:0,a:-Math.PI/2,hp:100,st:100,wp:[0,k?k:-1],cur:k?1:0,mag:[12,k?WP[k].mag:0],rl:0,cd:0,sp:0,bag:[],g:2,f:1,am:{l:48,h:k===2?60:0},inv:0,heal:0,hold:0,step:0,alive:true,r:14}}
const wpn=()=>WP[pl.wp[pl.cur]];
function shoot(){const w=wpn();if(pl.cd>0||pl.rl>0)return;if(pl.mag[pl.cur]<=0){reload();return}
  pl.cd=1/w.rate;pl.mag[pl.cur]--;pl.sp=Math.min(.14,pl.sp+w.sp*.5);const a=pl.a+rnd(-1,1)*(w.sp+pl.sp);
  bl.push({x:pl.x+Math.cos(pl.a)*22,y:pl.y+Math.sin(pl.a)*22,vx:Math.cos(a)*w.spd,vy:Math.sin(a)*w.spd,life:1,dmg:w.dmg,o:0,col:w.col});
  lights.push({x:pl.x+Math.cos(pl.a)*24,y:pl.y+Math.sin(pl.a)*24,r:330,t:.07});shake=Math.max(shake,2.5);sfx(pl.x,pl.y,pl.wp[pl.cur]===2?'rifle':'shot');noise(pl.x,pl.y,w.nz);
  parts.push({x:pl.x,y:pl.y,vx:Math.cos(pl.a+1.6)*rnd(60,140),vy:Math.sin(pl.a+1.6)*rnd(60,140),life:.7,max:.7,c:'#d9b25a',s:2,k:'c'});if(pl.mag[pl.cur]<=0)reload()}
function reload(){const w=wpn();if(pl.rl>0||pl.mag[pl.cur]>=w.mag||pl.am[w.am]<=0)return;pl.rl=w.rl;tone(220,.12,'square',.04)}
function hurt(d){if(pl.inv>0||!pl.alive)return;pl.hp-=d;hurtT=.45;shake=Math.max(shake,7);tone(110,.18,'sawtooth',.07,-50);if(pl.hp<=0)die('KILLED IN ACTION')}
function die(why){pl.alive=false;state='dead';lock=1.4;why_=why;sv.kit=0;sv.raids++;save();boom(.3,.8)}
function updPl(dt,I){const p=pl;if(I.aimed)p.a=Math.atan2(I.ay,I.ax);
  const spr=I.spr&&p.st>4&&(I.mx||I.my);p.st=clamp(p.st+(spr?-22:15)*dt,0,100);move(p,I.mx,I.my,(spr?330:225)*(p.rl>0?.92:1),dt);
  p.cd-=dt;p.inv-=dt;p.sp=Math.max(0,p.sp-dt*.25);if(p.rl>0){p.rl-=dt;if(p.rl<=0){const w=wpn(),n=Math.min(w.mag-p.mag[p.cur],p.am[w.am]);p.mag[p.cur]+=n;p.am[w.am]-=n}}
  if(p.heal>0){const h=Math.min(p.heal,30*dt);p.hp=Math.min(100,p.hp+h);p.heal-=h}
  if((I.mx||I.my)&&(p.step-=dt*(spr?2:1))<=0){p.step=.42;tone(70,.04,'triangle',.025);if(spr)noise(p.x,p.y,300)}
  if(I.fire&&!spr)shoot();if(I.rl)reload();if(I.sw&&p.wp[1-p.cur]>=0){p.cur=1-p.cur;p.rl=0;p.cd=.25}
  if(I.gr&&p.g>0)throwG('g');if(I.fl&&p.f>0)throwG('f');
  if(I.med){const i=p.bag.findIndex(b=>b.t==='m');if(i>=0&&p.hp<100){p.bag.splice(i,1);p.heal+=60;say('MEDKIT USED',1.5);tone(500,.2,'triangle',.05,300)}}
  let tg=null,td=56;for(const c of conts)if(!c.open){const d=hyp(c.x-p.x,c.y-p.y);if(d<td){td=d;tg=c}}if(!heli)for(const b of beacons){const d=hyp(b.x-p.x,b.y-p.y);if(d<td){td=d;tg=b;tg.radio=1}}
  p.near=tg;if(tg&&I.use){p.hold+=dt;const need=tg.radio?2.5:1;if(p.hold>=need){p.hold=0;if(tg.radio)callHeli(tg);else{tg.open=1;tg.items.forEach(it=>drops.push({x:tg.x+rnd(-22,22),y:tg.y+rnd(-22,22),it}));tone(300,.1,'triangle',.05)}}}else p.hold=0;
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];if(hyp(d.x-p.x,d.y-p.y)<28&&take(d.it))drops.splice(i,1)}}
function take(it){const p=pl;if(it.t==='a'){p.am[it.a]+=it.n;say('+'+it.n+' '+(it.a==='l'?'light':'heavy')+' ammo',1.2)}
  else if(it.t==='g')p.g++;else if(it.t==='f')p.f++;
  else if(it.t==='w'){if(p.wp[1]<0){p.wp[1]=it.k;p.mag[1]=WP[it.k].mag;p.cur=1}else if(it.k>p.wp[1]){p.wp[1]=it.k;p.mag[1]=WP[it.k].mag;p.cur=1}else return false;say('EQUIPPED '+WP[it.k].n.toUpperCase(),2)}
  else{if(p.bag.length>=6){say('BACKPACK FULL',1.2);return false}p.bag.push(it);say('+ '+(it.n||'Medkit'),1.5)}tone(700,.08,'triangle',.05,300);return true}
function throwG(k){const p=pl;if(k==='g')p.g--;else p.f--;gren.push({x:p.x,y:p.y,vx:Math.cos(p.a)*520+p.vx*.5,vy:Math.sin(p.a)*520+p.vy*.5,t:k==='g'?1.7:1.3,k})}
function explode(b){lights.push({x:b.x,y:b.y,r:b.k==='g'?420:600,t:.25});burst(b.x,b.y,b.k==='g'?'#ffb347':'#fff',b.k==='g'?40:30,360,.6);sfx(b.x,b.y,'boom');noise(b.x,b.y,1200);
  if(b.k==='g'){shake=Math.max(shake,16);for(const e of E){const d=hyp(e.x-b.x,e.y-b.y);if(d<150&&los(b.x,b.y,e.x,e.y))hitE(e,e.t==='b'?140:110*(1-d/190))}const d=hyp(pl.x-b.x,pl.y-b.y);if(d<150)hurt(60*(1-d/190))}
  else{for(const e of E){const d=hyp(e.x-b.x,e.y-b.y);if(d<340&&los(b.x,b.y,e.x,e.y)){e.stun=e.t==='b'?1.5:5;e.st=0}}if(hyp(pl.x-b.x,pl.y-b.y)<320&&los(b.x,b.y,pl.x,pl.y)){flashT=2.6;tone(2400,1.2,'sine',.05)}}}
function burst(x,y,c,n,s,l=.5){for(let i=0;i<n&&parts.length<600;i++){const a=rnd(0,TAU),v=rnd(.2,1)*s;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.3,1)*l,max:l,c,s:rnd(1.5,3.5)})}}

/* helicopter extraction */
function callHeli(b){heli={lx:b.x,ly:b.y,st:1,t:0,eta:38,x:b.x+Math.cos(2.4)*2600,y:b.y-1800,board:0,wv:0,wt:3};say('RADIO: HELICOPTER INBOUND. HOLD THE ZONE',4);tone(900,.15,'square',.06);tone(700,.2,'square',.06)}
function updHeli(dt){const h=heli;if(!h)return;h.t+=dt;
  if(h.st===1){const k=Math.min(1,h.t/h.eta),e=k*k*(3-2*k),sx=h.lx+Math.cos(2.4)*2600,sy=h.ly-1800;h.x=sx+(h.lx-sx)*e;h.y=sy+(h.ly-sy)*e;if(k>=1){h.st=2;say('HELICOPTER ON SITE: STAY IN THE ZONE',4)}}
  else{h.x=h.lx+Math.sin(T*1.3)*4;h.y=h.ly+Math.cos(T*1.1)*4;h.wt-=dt;
    if(h.wt<=0&&E.length<34){h.wt=11;h.wv++;const n=h.wv===3?1:3;for(let i=0;i<n;i++){const a=rnd(0,TAU),d=rnd(650,850),e=mkE(h.wv===3&&i===0?'b':'r',clamp(h.lx+Math.cos(a)*d,60,WORLD-60),clamp(h.ly+Math.sin(a)*d,60,WORLD-60));if(h.wv===3){e.hp=e.mhp=350;e.r=34}e.st=1;e.tx=h.lx;e.ty=h.ly}
      if(h.wv%2===0){const e=mkE('d',h.lx+500,h.ly-500);e.st=1;e.tx=h.lx;e.ty=h.ly}say('WAVE '+h.wv+': CONTACTS INCOMING',3);noise(h.lx,h.ly,3000)}
    if(pl.alive&&hyp(pl.x-h.lx,pl.y-h.ly)<160)h.board+=dt;else h.board=Math.max(0,h.board-dt*.5);if(h.board>=14)extract()}
  if(roG)roG.gain.value=muted?0:clamp(1-hyp(h.x-pl.x,h.y-pl.y)/2600,0,1)*.07}
function extract(){const v=pl.bag.reduce((s,b)=>s+(b.v||0),0);loot_=v;sv.cr+=v+250;sv.kit=pl.wp[1]>0?pl.wp[1]:0;sv.ex++;sv.raids++;sv.best=Math.max(sv.best,v);save();state='won';lock=1.6;if(roG)roG.gain.value=0;tone(660,.5,'triangle',.08,500)}

/* main simulation */
let state='title',T=0,lock=0,raidT=0,photo=false,dev=false,rays=false,paused=false,shake=0,flashT=0,hurtT=0,msgs=[],kills=0,loot_=0,why_='',fps=60,ft=16,lastDraw=0;
const cam={x:WORLD/2,y:WORLD-300},explored=new Uint8Array(125*125);
function say(s,t=2.5){msgs.push({s,t});if(msgs.length>3)msgs.shift()}
function deploy(){audio();genMap();pl=mkPl();raidT=0;kills=0;flashT=hurtT=0;cam.x=pl.x;cam.y=pl.y;state='play';paused=false;say('DEPLOYED: FIND A RADIO BEACON, CALL THE HELICOPTER',5)}
function sim(dt,I){raidT+=dt;if(raidT>=600){die('MISSING IN ACTION');return}
  if(pl.alive)updPl(dt,I);for(const e of E)updE(e,dt);E=E.filter(e=>!e.dead);
  for(const b of bl){const n=Math.ceil(hyp(b.vx,b.vy)*dt/10),sx=b.vx*dt/n,sy=b.vy*dt/n;let dead=false;
    for(let i=0;i<n&&!dead;i++){b.x+=sx;b.y+=sy;if(solidAt(b.x,b.y)){dead=true;burst(b.x,b.y,'#ffe9a8',3,120,.2);break}
      if(!b.o){for(const e of E)if(!e.dead&&hyp(e.x-b.x,e.y-b.y)<e.r+3){hitE(e,b.dmg);dead=true;burst(b.x,b.y,'#c43a3a',4,160,.3);sfx(b.x,b.y,'hit');break}}
      else if(pl.alive&&hyp(pl.x-b.x,pl.y-b.y)<16){hurt(b.dmg);dead=true;break}}
    b.life=dead?0:b.life-dt}bl=bl.filter(b=>b.life>0);
  for(const b of gren){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=Math.pow(.12,dt);b.vy*=Math.pow(.12,dt);if(solidAt(b.x,b.y)){b.x-=b.vx*dt*2;b.y-=b.vy*dt*2;b.vx*=-.4;b.vy*=-.4}b.t-=dt;if(b.t<=0)explode(b)}gren=gren.filter(b=>b.t>0);
  updHeli(dt);
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;q.life-=dt;if(q.k==='c'&&q.life<=0&&decals.length<200)decals.push({x:q.x,y:q.y,r:1.6,c:'#8a7440'})}parts=parts.filter(q=>q.life>0);
  for(const l of lights)l.t-=dt;lights=lights.filter(l=>l.t>0);shake=Math.max(0,shake-dt*28);flashT=Math.max(0,flashT-dt);hurtT=Math.max(0,hurtT-dt);for(const m of msgs)m.t-=dt;msgs=msgs.filter(m=>m.t>0)}
function tick(dt){const I=readInput(),ok=nav(),ps=pads();T+=dt;snd=0;lock=Math.max(0,lock-dt);
  if(ps.some(P=>P.buttons.some(b=>b.pressed)))audio();
  const pz=edge('op',ps.some(P=>P.buttons[9]&&P.buttons[9].pressed));
  if(state==='play'&&(kp.has('KeyP')||kp.has('Escape')||pz))paused=!paused;
  if(state==='title'||state==='dead'||state==='won'){if(ok&&!lock)deploy()}
  if((state==='play'||state==='dead')&&!paused){const d=dt*(photo?.2:1);sim(d,state==='dead'?{mx:0,my:0}:I)}
  if(pl&&state!=='title'){const tx=pl.x+Math.cos(pl.a)*(pl.alive?90:0),ty=pl.y+Math.sin(pl.a)*(pl.alive?90:0);cam.x+=(tx-cam.x)*Math.min(1,7*dt);cam.y+=(ty-cam.y)*Math.min(1,7*dt)}}

/* lighting: raycast visibility + flashlight cone + fog of war */
const NR=220,rp=new Float32Array(NR*2);
function cast(){const px=pl.x,py=pl.y;for(let i=0;i<NR;i++){const a=i/NR*TAU,c=Math.cos(a),s=Math.sin(a);let d=0;
    while(d<900){d+=10;if(solidAt(px+c*d,py+s*d)){d-=6;if(solidAt(px+c*d,py+s*d))d-=3;break}}
    rp[i*2]=px+c*d;rp[i*2+1]=py+s*d;for(let k=24;k<=Math.min(d,430);k+=24){const cx=(px+c*k)/24|0,cy=(py+s*k)/24|0;if(cx>=0&&cy>=0&&cx<125&&cy<125)explored[cy*125+cx]=1}}}
function seen(x,y){const d=hyp(x-pl.x,y-pl.y);if(d>900)return false;if(d>460&&Math.abs(adiff(Math.atan2(y-pl.y,x-pl.x),pl.a))>.44)return false;return los(pl.x,pl.y,x,y)}
function lighting(){const n=clamp(raidT/330,0,1),ox=cam.x-W/2,oy=cam.y-H/2;dg.setTransform(.5,0,0,.5,0,0);dg.globalCompositeOperation='source-over';
  dg.fillStyle='rgba('+(30-27*n|0)+','+(18-12*n|0)+','+(16-2*n|0)+','+(.55+.4*n)+')';dg.fillRect(0,0,W,H);dg.globalCompositeOperation='destination-out';
  dg.beginPath();for(let cy=Math.max(0,oy/24|0);cy<=Math.min(124,(oy+H)/24|0);cy++)for(let cx=Math.max(0,ox/24|0);cx<=Math.min(124,(ox+W)/24|0);cx++)if(explored[cy*125+cx])dg.rect(cx*24-ox,cy*24-oy,24,24);dg.fillStyle='rgba(0,0,0,.2)';dg.fill();
  const sx=pl.x-ox,sy=pl.y-oy;dg.beginPath();for(let i=0;i<NR;i++){const x=rp[i*2]-ox,y=rp[i*2+1]-oy;i?dg.lineTo(x,y):dg.moveTo(x,y)}dg.closePath();
  let gr=dg.createRadialGradient(sx,sy,0,sx,sy,520);gr.addColorStop(0,'rgba(0,0,0,.95)');gr.addColorStop(.6,'rgba(0,0,0,.55)');gr.addColorStop(1,'rgba(0,0,0,0)');dg.fillStyle=gr;dg.fill();
  dg.save();dg.beginPath();dg.moveTo(sx,sy);dg.arc(sx,sy,950,pl.a-.44,pl.a+.44);dg.closePath();dg.clip();
  dg.beginPath();for(let i=0;i<NR;i++){const x=rp[i*2]-ox,y=rp[i*2+1]-oy;i?dg.lineTo(x,y):dg.moveTo(x,y)}dg.closePath();
  gr=dg.createRadialGradient(sx,sy,60,sx,sy,950);gr.addColorStop(0,'rgba(0,0,0,.9)');gr.addColorStop(1,'rgba(0,0,0,0)');dg.fillStyle=gr;dg.fill();dg.restore();
  const lp=(x,y,r,a)=>{if(Math.abs(x-cam.x)>W/2+r||Math.abs(y-cam.y)>H/2+r)return;const q=dg.createRadialGradient(x-ox,y-oy,0,x-ox,y-oy,r);q.addColorStop(0,'rgba(0,0,0,'+a+')');q.addColorStop(1,'rgba(0,0,0,0)');dg.fillStyle=q;dg.beginPath();dg.arc(x-ox,y-oy,r,0,TAU);dg.fill()};
  for(const l of lights)lp(l.x,l.y,l.r,Math.min(1,l.t*14));if(heli&&heli.st===2){lp(heli.lx,heli.ly,330,.9)}if(heli)lp(heli.lx,heli.ly,190,.6);
  g.drawImage(dk,0,0,W,H)}

/* drawing */
function drawShip(e,col){g.save();g.translate(e.x,e.y);g.rotate(e.a);
  if(e.t==='r'||e.t==='p'){g.fillStyle='#111';g.fillRect(8,-3,20,6);g.fillStyle=e.fl>0?'#fff':col;g.beginPath();g.arc(0,0,14,0,TAU);g.fill();g.strokeStyle='#0a0c0a';g.lineWidth=2;g.stroke();g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.arc(-2,0,7,0,TAU);g.fill()}

  else{g.fillStyle=e.fl>0?'#fff':'#2f4a2a';g.beginPath();for(let i=0;i<12;i++){const a=i/12*TAU,r=e.r*(1+.16*Math.sin(i*3+T*3));i?g.lineTo(Math.cos(a)*r,Math.sin(a)*r):g.moveTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();g.fill();g.strokeStyle='#14240f';g.lineWidth=3;g.stroke();g.fillStyle='#d6ff3a';g.beginPath();g.arc(e.r*.55,-9,5,0,TAU);g.arc(e.r*.55,9,5,0,TAU);g.fill()}
  g.restore()}
function glow(x,y,r,c,a){const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,c);q.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=a;g.fillStyle=q;g.fillRect(x-r,y-r,r*2,r*2);g.globalAlpha=1}
let rain=Array.from({length:150},()=>({x:R(),y:R(),v:rnd(.8,1.4)}));
function draw(){g.setTransform(DPR,0,0,DPR,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.fillStyle='#0b0e0b';g.fillRect(0,0,W,H);
  if(state==='title'){drawRain();title();return}
  const ox=cam.x-W/2,oy=cam.y-H/2,vis=(x,y,r)=>Math.abs(x-cam.x)<W/2+r&&Math.abs(y-cam.y)<H/2+r;
  const sx=shake>0?rnd(-shake,shake):0,sy=shake>0?rnd(-shake,shake):0;

  g.fillStyle='#343a32';for(const f of floors)if(vis(f.x+f.w/2,f.y+f.h/2,300)){g.fillRect(f.x,f.y,f.w,f.h);if(f.boss){g.fillStyle='rgba(120,255,60,.06)';g.fillRect(f.x,f.y,f.w,f.h);g.fillStyle='#343a32'}}
  for(const d of decals)if(vis(d.x,d.y,40)){g.fillStyle=d.c;g.beginPath();g.arc(d.x,d.y,d.r,0,TAU);g.fill()}
  for(const c of conts)if(vis(c.x,c.y,40)){g.fillStyle=c.open?'#2a2e29':'#5b5a44';g.fillRect(c.x-16,c.y-11,32,22);g.strokeStyle='#14160f';g.lineWidth=2;g.strokeRect(c.x-16,c.y-11,32,22);if(!c.open){g.fillStyle='#8a8765';g.fillRect(c.x-3,c.y-11,6,22)}}

  g.lineWidth=2;for(const w of walls)if(vis(w.x+w.w/2,w.y+w.h/2,Math.max(w.w,w.h))){g.fillStyle='rgba(0,0,0,.4)';g.fillRect(w.x+5,w.y+6,w.w,w.h);g.fillStyle=w.c===2?'#6a4a3a':w.c===1?'#5a5f58':'#80867d';g.fillRect(w.x,w.y,w.w,w.h);g.strokeStyle='#10130f';g.strokeRect(w.x,w.y,w.w,w.h)}
  for(const e of E)if(vis(e.x,e.y,60)&&(seen(e.x,e.y)||e.t==='d'&&false))drawShip(e,e.t==='r'?'#6e5a48':'#fff');
  if(pl.alive)drawShip({x:pl.x,y:pl.y,a:pl.a,t:'p',fl:0},'#7f9a7c');
  for(const b of gren){g.fillStyle=b.k==='g'?'#8a9a4a':'#dde';g.beginPath();g.arc(b.x,b.y,5,0,TAU);g.fill()}
  g.restore();
  /* weather under the darkness */
  g.globalAlpha=.9;const fo=-((cam.x*.35+T*14)%512),fp=-((cam.y*.35+T*6)%512);for(let x=fo-512;x<W;x+=512)for(let y=fp-512;y<H;y+=512)g.drawImage(fgc,x,y);g.globalAlpha=1;drawRain();
  if(pl.alive)cast();else for(let i=0;i<NR;i++){rp[i*2]=pl.x;rp[i*2+1]=pl.y}
  lighting();
  /* lit layer: glowing loot, flares, tracers, helicopter */
  g.save();g.translate(-ox+sx,-oy+sy);g.globalCompositeOperation='lighter';
  for(const d of drops)if(vis(d.x,d.y,60)&&seen(d.x,d.y)){const c=d.it.t==='v'?d.it.c:d.it.t==='m'?'#ff5a6e':d.it.t==='w'?'#6aa8ff':d.it.t==='a'?'#ffd27a':'#9ad';glow(d.x,d.y,34+Math.sin(T*4+d.x)*5,c,.6);g.fillStyle=c;g.fillRect(d.x-4,d.y-4,8,8)}
  for(const e of E)if(vis(e.x,e.y,200)){if(e.t==='d')glow(e.x,e.y,40,e.stun>0?'#333':'#ff3355',.5);if(e.t==='t'&&e.st===2)glow(e.x,e.y,50,'#ff3b3b',.5);if(e.t==='b'&&seen(e.x,e.y))glow(e.x+Math.cos(e.a)*e.r*.55,e.y+Math.sin(e.a)*e.r*.55,50,'#d6ff3a',.4)}
  for(const b of beacons)if(vis(b.x,b.y,80))glow(b.x,b.y,28,Math.floor(T*2)%2?'#ff3b3b':'#400',.7);
  for(const b of bl)if(vis(b.x,b.y,50)){g.strokeStyle=b.col;g.lineWidth=b.o?3:3.5;g.globalAlpha=.9;g.beginPath();g.moveTo(b.x,b.y);g.lineTo(b.x-b.vx*.03,b.y-b.vy*.03);g.stroke();g.globalAlpha=1}
  for(const q of parts)if(vis(q.x,q.y,20)&&q.k!=='c'){g.globalAlpha=Math.max(0,q.life/q.max);g.fillStyle=q.c;g.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s)}g.globalAlpha=1;
  if(heli){const h=heli;if(h.st>=1){const k=1+Math.sin(T*5)*.1;glow(h.lx,h.ly,190*k,'#ff8a2a',.28);g.strokeStyle='rgba(255,150,60,.7)';g.lineWidth=3;g.beginPath();g.arc(h.lx,h.ly,150,0,TAU);g.stroke();
      if(h.board>0){g.strokeStyle='#6dff8c';g.lineWidth=6;g.beginPath();g.arc(h.lx,h.ly,150,-Math.PI/2,-Math.PI/2+TAU*h.board/14);g.stroke()}}
    if(vis(h.x,h.y,200)){g.save();g.translate(h.x,h.y);g.rotate(h.st===1?Math.atan2(h.ly-h.y,h.lx-h.x):-1.2);g.fillStyle='#222a2a';g.beginPath();g.ellipse(0,0,46,18,0,0,TAU);g.fill();g.fillRect(-90,-3,50,6);g.fillStyle='#303838';g.fillRect(-98,-14,12,28);
      g.strokeStyle='rgba(200,210,200,.5)';g.lineWidth=3;for(let i=0;i<2;i++){const a=T*34+i*Math.PI/2;g.beginPath();g.moveTo(Math.cos(a)*80,Math.sin(a)*80);g.lineTo(-Math.cos(a)*80,-Math.sin(a)*80);g.stroke()}g.fillStyle='rgba(180,200,190,.08)';g.beginPath();g.arc(0,0,80,0,TAU);g.fill();g.restore()}}
  g.restore();
  if(rays&&pl.alive){g.save();g.translate(-ox,-oy);g.strokeStyle='rgba(80,255,140,.28)';g.lineWidth=1;g.beginPath();for(let i=0;i<NR;i+=3){g.moveTo(pl.x,pl.y);g.lineTo(rp[i*2],rp[i*2+1])}g.stroke();g.fillStyle='#6dff8c';for(let i=0;i<NR;i++)g.fillRect(rp[i*2]-1.5,rp[i*2+1]-1.5,3,3);g.restore()}
  g.drawImage(vg,0,0);g.globalAlpha=.07;g.fillStyle=g.createPattern(gn,'repeat');g.save();g.translate(rnd(0,128),rnd(0,128));g.fillRect(-128,-128,W+256,H+256);g.restore();g.globalAlpha=1;
  if(hurtT>0){g.fillStyle='rgba(200,10,20,'+Math.min(.4,hurtT)+')';g.fillRect(0,0,W,H)}if(flashT>0){g.fillStyle='rgba(255,255,255,'+Math.min(1,flashT)+')';g.fillRect(0,0,W,H)}
  if(!photo)hud();if(photo){g.globalAlpha=Math.max(0,1-(T%1000)*0);txt('PHOTO MODE  (F2 / Create to exit)',W/2,H-24,13,'rgba(255,255,255,.35)')}
  if(dev)devPanel();if(state==='dead'||state==='won')endScreen();if(paused){g.fillStyle='rgba(5,8,5,.7)';g.fillRect(0,0,W,H);txt('PAUSED',W/2,H/2,44,'#fff');txt('P, Esc or Options to resume',W/2,H/2+34,15,'#9fb0a0')}}
function drawRain(){g.strokeStyle='rgba(170,190,210,.28)';g.lineWidth=1;g.beginPath();for(const r of rain){r.y+=r.v*.03;r.x-=r.v*.006;if(r.y>1){r.y=0;r.x=R()*1.2}if(r.x<0)r.x+=1.2;const x=r.x*W,y=r.y*H;g.moveTo(x,y);g.lineTo(x-4,y+16)}g.stroke()}
function txt(s,x,y,size,col,al='center'){g.font='bold '+size+'px "Trebuchet MS",Verdana,sans-serif';g.textAlign=al;g.fillStyle=col;g.fillText(s,x,y)}
function bar(x,y,w,v,c){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(x,y,w,9);g.fillStyle=c;g.fillRect(x,y,w*clamp(v,0,1),9)}
function hud(){const left=Math.max(0,600-raidT),n=raidT/330,m=msgs[msgs.length-1];
  txt(Math.floor(left/60)+':'+String(Math.floor(left%60)).padStart(2,'0'),W/2,30,24,left<60?'#ff5a5a':'#e6efe3');txt(n<.45?'DUSK':'NIGHT',W/2,48,12,'#9fb0a0');
  let obj='Find a radio beacon (red light) and hold E / Cross';if(heli){obj=heli.st===1?'HELICOPTER ETA '+Math.max(0,Math.ceil(heli.eta-heli.t))+'s: SURVIVE':hyp(pl.x-heli.lx,pl.y-heli.ly)<160?'BOARDING '+Math.round(heli.board/14*100)+'%: HOLD THE ZONE':'GET TO THE LANDING ZONE'}
  txt(obj,W/2,70,15,'#ffb347');
  const tg=heli?{x:heli.lx,y:heli.ly}:beacons.reduce((a,b)=>!a||hyp(b.x-pl.x,b.y-pl.y)<hyp(a.x-pl.x,a.y-pl.y)?b:a,null);
  if(tg){const a=Math.atan2(tg.y-pl.y,tg.x-pl.x);g.save();g.translate(W/2+Math.cos(a)*(Math.min(W,H)*.36),H/2+Math.sin(a)*(Math.min(W,H)*.36));g.rotate(a);g.fillStyle='rgba(255,179,71,.8)';g.beginPath();g.moveTo(12,0);g.lineTo(-8,-8);g.lineTo(-8,8);g.closePath();g.fill();g.restore()}
  if(pl.near&&pl.alive){const p=pl.near;txt(p.radio?'HOLD E / CROSS: RADIO HELICOPTER':'HOLD E / CROSS: SEARCH',W/2,H/2+60,14,'#fff');if(pl.hold>0){g.fillStyle='#6dff8c';g.fillRect(W/2-40,H/2+68,80*pl.hold/(p.radio?2.5:1),5)}}
  if(m){g.globalAlpha=Math.min(1,m.t);txt(m.s,W/2,H-150,18,'#fff');g.globalAlpha=1}
  const x=20,y=H-70;txt('HEALTH',x,y-6,11,'#9fb0a0','left');bar(x,y,220,pl.hp/100,pl.hp>35?'#6dff8c':'#ff5a5a');txt('STAMINA',x,y+22,11,'#9fb0a0','left');bar(x,y+28,220,pl.st/100,'#ffd23d');
  const w=wpn(),bx=W/2-150,by=H-72;g.fillStyle='rgba(0,0,0,.5)';g.fillRect(bx,by,300,52);txt(w.n.toUpperCase(),bx+10,by+20,15,w.col,'left');txt(pl.rl>0?'RELOADING':pl.mag[pl.cur]+' / '+pl.am[w.am],bx+290,by+20,15,'#fff','right');
  txt('GRENADE '+pl.g+'   FLASH '+pl.f+'   '+(pl.wp[1]>=0?(pl.cur?'[Q] PISTOL':'[Q] '+WP[pl.wp[1]].n.toUpperCase()):''),bx+10,by+42,12,'#9fb0a0','left');
  const sx=W-6*46-20;txt('BACKPACK  '+pl.bag.reduce((s,b)=>s+(b.v||0),0)+' CR',W-20,H-72,12,'#9fb0a0','right');
  for(let i=0;i<6;i++){const b=pl.bag[i];g.fillStyle='rgba(0,0,0,.5)';g.fillRect(sx+i*46,H-62,40,40);g.strokeStyle=b?(b.t==='m'?'#ff5a6e':b.c):'#333';g.lineWidth=2;g.strokeRect(sx+i*46,H-62,40,40);if(b){g.fillStyle=b.t==='m'?'#ff5a6e':b.c;g.fillRect(sx+i*46+12,H-50,16,16)}}}
function devPanel(){const L=['FPS '+fps.toFixed(0)+'  frame '+ft.toFixed(1)+' ms','rays '+NR+' (cast, grid-accelerated)','enemies '+E.length+'  bullets '+bl.length+'  particles '+parts.length,'lights '+lights.length+'  explored cells '+explored.reduce((a,b)=>a+b,0),'F2 photo   F3 panel   F4 ray debug'];g.fillStyle='rgba(0,0,0,.6)';g.fillRect(10,10,330,L.length*18+12);L.forEach((s,i)=>txt(s,20,30+i*18,12,'#6dff8c','left'))}
function title(){g.fillStyle='rgba(5,8,5,.5)';g.fillRect(0,0,W,H);const s=Math.min(78,W/9);g.save();g.shadowColor='#ff8a2a';g.shadowBlur=30;txt('NIGHTFALL EXFIL',W/2,H*.3,s,'#ffb347');g.restore();
  txt('Loot the zone. Radio the helicopter. Hold the landing zone. Get out alive.',W/2,H*.3+36,17,'#b8c9bf');
  txt('Credits '+sv.cr+'    Raids '+sv.raids+'    Extractions '+sv.ex+'    Best haul '+sv.best,W/2,H*.5,17,'#e6efe3');txt('Kit: '+(sv.kit>0?WP[sv.kit].n+' (kept from your last extraction)':'Pistol only'),W/2,H*.5+26,15,'#9fb0a0');
  if(Math.floor(T*2)%2===0)txt('Press Cross, Enter or click to deploy',W/2,H*.6,20,'#fff');
  ['Controller: left stick move, right stick aim, R2 fire, L2 sprint, Cross hold to search or radio','Square reload, Triangle swap weapon, L1 grenade, R1 flashbang, D-pad left medkit, Options pause','Keyboard: WASD, mouse aim and click, Shift sprint, hold E, R reload, Q swap, G grenade, F flashbang, H medkit','F2 or Create: photo mode.  F3 or D-pad up: stats.  F4 or D-pad down: light-ray view.  M: mute'].forEach((l,i)=>txt(l,W/2,H*.7+i*24,Math.min(14,W/60),'#8fa89c'))}
function endScreen(){g.fillStyle='rgba(5,8,5,.6)';g.fillRect(0,H*.28,W,H*.36);const w=state==='won';
  txt(w?'EXTRACTED':why_,W/2,H*.4,Math.min(54,W/14),w?'#6dff8c':'#ff5a5a');
  txt(w?'Haul '+loot_+' CR    Total '+sv.cr+' CR    Kills '+kills+'    Kit kept: '+(sv.kit>0?WP[sv.kit].n:'none'):'Gear lost.    Kills '+kills+'    Survived '+Math.floor(raidT/60)+'m '+Math.floor(raidT%60)+'s',W/2,H*.4+36,17,'#e6efe3');
  if(!lock&&Math.floor(T*2)%2===0)txt('Press Cross, Enter or click to deploy again',W/2,H*.4+76,19,'#fff')}
let last=0,acc=0,fc=0;
function frame(t){const dt=Math.min(.05,(t-last)/1e3||0);last=t;const t0=performance.now();
  try{tick(dt);draw()}catch(e){console.error(e)}kp.clear();ft=ft*.9+(performance.now()-t0)*.1;acc+=dt;fc++;if(acc>.5){fps=fc/acc;acc=fc=0}
  if(AC&&rainG)rainG.gain.value=muted?0:.03;requestAnimationFrame(frame)}
requestAnimationFrame(frame);
